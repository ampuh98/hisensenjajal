plugins {
    id 'com.android.application'
}
android {
    namespace 'com.hisense.customlauncher'
    compileSdk 33
    defaultConfig {
        applicationId "com.hisense.customlauncher"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
